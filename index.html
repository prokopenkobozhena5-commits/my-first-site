<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio | Social Communications & SMM</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 50px 20px;
        }
        .container {
            background: white;
            max-width: 450px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 30px;
            text-align: center;
        }
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #000;
        }
        h1 { font-size: 1.5rem; margin-bottom: 8px; }
        .specialty { color: #6c757d; margin-bottom: 25px; font-weight: 500; }
        
        .info-block {
            text-align: left;
            margin-bottom: 20px;
        }
        .info-block h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; color: #adb5bd; margin-bottom: 10px; }
        
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-start;
        }
        .tags span {
            background: #e9ecef;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        .btn {
            display: block;
            background: #000;
            color: #fff;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            margin-top: 25px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://via.placeholder.com/110" alt="Profile" class="avatar">
    <h1>Студентка Львівської політехніки</h1>
    <p class="specialty">Соціальні комунікації та SMM</p>

    <div class="info-block">
        <h2>Освіта та Навички</h2>
        <div class="tags">
            <span>Інформаційна діяльність</span>
            <span>SMM Стратегія</span>
            <span>Project Management</span>
            <span>Аналітика</span>
        </div>
    </div>

    <div class="info-block">
        <h2>Lifestyle</h2>
        <div class="tags">
            <span>Dance (Contemporary/Jazz)</span>
            <span>Reading</span>
        </div>
    </div>

    <a href="mailto:your-email@example.com" class="btn">Надіслати повідомлення</a>
</div>

</body>
</html>
