<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Біографія</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            text-align: center;
        }
        img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #007bff;
        }
        h1 {
            margin: 10px 0 5px;
            font-size: 1.8rem;
        }
        p {
            margin-bottom: 20px;
            color: #666;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .links a {
            text-decoration: none;
            background: #007bff;
            color: white;
            padding: 10px;
            border-radius: 8px;
            transition: background 0.3s ease;
        }
        .links a:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="https://via.placeholder.com/120" alt="Ваше Фото">
    
    <h1>Олександр Іванов</h1>
    <p>Full-stack розробник & любитель кави. Будую цікаві штуки в інтернеті.</p>

    <div class="links">
        <a href="https://github.com" target="_blank">GitHub</a>
        <a href="https://linkedin.com" target="_blank">LinkedIn</a>
        <a href="https://t.me" target="_blank">Telegram</a>
        <a href="mailto:example@email.com">Написати листа</a>
    </div>
</div>

</body>
</html>
